version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      obsidian:
        patterns:
          - "obsidian"
      dev-tooling:
        patterns:
          - "@typescript-eslint/*"
          - "typescript"
          - "eslint*"
          - "vitest"
          - "esbuild"
          - "@types/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
